services:
  - type: web
    name: little-nest
    env: python
    buildCommand: "./build.sh"
    startCommand: "python ecombabyshoppingproject/manage.py migrate && gunicorn index:app"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: DATABASE_URL
        fromDatabase:
          name: little-nest-db
          property: connectionString

databases:
  - name: little-nest-db
    databaseName: littlenest
    user: littlenest_user
    plan: free


