services:
  - type: web
    name: little-nest
    env: python
    buildCommand: "./build.sh"
    startCommand: "python ecombabyshoppingproject/manage.py migrate && gunicorn index:app"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # If using PostgreSQL, link or set DATABASE_URL:
      # - key: DATABASE_URL
      #   value: postgres://...

