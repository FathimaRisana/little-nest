{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Little Nest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --pink-light: #FFF6F8;
            --pink-brand: #FF6B9A;
            --pink-dark: #E75480;
            --text-color: #4A4E69;
        }

        body {
            margin: 0;
            font-family: 'Quicksand', 'Nunito', sans-serif;
            background: linear-gradient(rgba(255, 246, 248, 0.45), rgba(255, 246, 248, 0.3)),
                        url("{% static 'images/regbgnewimg.png' %}") center/cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            color: var(--text-color);
        }

        .otp_card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 45px 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(231, 84, 128, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .otp_icon {
            font-size: 50px;
            color: var(--pink-brand);
            margin-bottom: 15px;
            display: inline-block;
        }

        .otp_card h2 {
            color: var(--pink-dark);
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 26px;
        }

        .otp_card p {
            font-size: 15px;
            color: #718096;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 500;
        }

        .otp_card input {
            width: 100%;
            max-width: 240px;
            padding: 12px;
            margin-bottom: 25px;
            border: 2px solid rgba(255, 107, 154, 0.15);
            border-radius: 12px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 8px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            background-color: var(--pink-light);
            color: var(--text-color);
        }

        .otp_card input:focus {
            border-color: var(--pink-brand);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 107, 154, 0.1);
        }

        .otp_card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pink-brand), var(--pink-dark));
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 154, 0.2);
            transition: all 0.3s ease;
        }

        .otp_card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 107, 154, 0.35);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--pink-brand);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--pink-dark);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="otp_card">
    <div class="otp_icon">
        <i class="bi bi-shield-check"></i>
    </div>
    <h2>Verify OTP</h2>
    <p>Please enter the 6-digit verification code sent to your email address.</p>

    <form method="post" action="{% url 'verify_otp' %}">
        {% csrf_token %}
        <input type="text" placeholder="------" name="otp" maxlength="6" autocomplete="off" required><br>
        <button type="submit">Verify Code</button>
    </form>

    <a href="{% url 'send_otp' %}" class="back-link"><i class="bi bi-arrow-left me-1"></i>Resend OTP Code</a>
</div>

</body>
</html>
